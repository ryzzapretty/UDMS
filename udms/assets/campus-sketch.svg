<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="sketchFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <g stroke="#60a5fa" stroke-width="1.2" fill="none" opacity="0.45" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground line -->
    <line x1="0" y1="115" x2="500" y2="115" stroke-width="1.5" />

    <!-- Left Wing -->
    <rect x="50" y="60" width="120" height="55" fill="#f0f7ff" fill-opacity="0.6" />
    <line x1="50" y1="75" x2="170" y2="75" />
    <line x1="50" y1="95" x2="170" y2="95" />
    <!-- Left Wing Windows -->
    <rect x="62" y="65" width="10" height="8" /><rect x="82" y="65" width="10" height="8" /><rect x="102" y="65" width="10" height="8" /><rect x="122" y="65" width="10" height="8" /><rect x="142" y="65" width="10" height="8" />
    <rect x="62" y="80" width="10" height="12" /><rect x="82" y="80" width="10" height="12" /><rect x="102" y="80" width="10" height="12" /><rect x="122" y="80" width="10" height="12" /><rect x="142" y="80" width="10" height="12" />
    <rect x="62" y="99" width="10" height="12" /><rect x="82" y="99" width="10" height="12" /><rect x="102" y="99" width="10" height="12" /><rect x="122" y="99" width="10" height="12" /><rect x="142" y="99" width="10" height="12" />

    <!-- Center Building -->
    <rect x="170" y="45" width="160" height="70" fill="#e0f2fe" fill-opacity="0.7" />
    <!-- Center Pediment / Triangle Roof -->
    <polygon points="250,15 170,45 330,45" fill="#bae6fd" fill-opacity="0.8" />
    <!-- Clock or Medallion in Pediment -->
    <circle cx="250" cy="33" r="7" />
    <circle cx="250" cy="33" r="5" />
    
    <!-- Classical Columns -->
    <line x1="190" y1="45" x2="190" y2="115" stroke-width="2" />
    <line x1="210" y1="45" x2="210" y2="115" stroke-width="2" />
    <line x1="230" y1="45" x2="230" y2="115" stroke-width="2" />
    <line x1="270" y1="45" x2="270" y2="115" stroke-width="2" />
    <line x1="290" y1="45" x2="290" y2="115" stroke-width="2" />
    <line x1="310" y1="45" x2="310" y2="115" stroke-width="2" />

    <!-- Center Grand Entrance Portal -->
    <path d="M 235,115 L 235,80 C 235,68 265,68 265,80 L 265,115 Z" fill="#93c5fd" fill-opacity="0.5" />
    <line x1="250" y1="75" x2="250" y2="115" />

    <!-- Steps -->
    <line x1="225" y1="110" x2="275" y2="110" />
    <line x1="220" y1="113" x2="280" y2="113" />

    <!-- Right Wing -->
    <rect x="330" y="60" width="120" height="55" fill="#f0f7ff" fill-opacity="0.6" />
    <line x1="330" y1="75" x2="450" y2="75" />
    <line x1="330" y1="95" x2="450" y2="95" />
    <!-- Right Wing Windows -->
    <rect x="348" y="65" width="10" height="8" /><rect x="368" y="65" width="10" height="8" /><rect x="388" y="65" width="10" height="8" /><rect x="408" y="65" width="10" height="8" /><rect x="428" y="65" width="10" height="8" />
    <rect x="348" y="80" width="10" height="12" /><rect x="368" y="80" width="10" height="12" /><rect x="388" y="80" width="10" height="12" /><rect x="408" y="80" width="10" height="12" /><rect x="428" y="80" width="10" height="12" />
    <rect x="348" y="99" width="10" height="12" /><rect x="368" y="99" width="10" height="12" /><rect x="388" y="99" width="10" height="12" /><rect x="408" y="99" width="10" height="12" /><rect x="428" y="99" width="10" height="12" />

    <!-- Trees on Left -->
    <path d="M 20,115 C 5,110 5,85 20,80 C 22,70 38,70 42,80 C 55,82 55,108 45,115 Z" fill="#93c5fd" fill-opacity="0.4" />
    <path d="M 10,115 C 0,112 0,98 10,95 C 12,90 25,90 28,95 C 38,98 38,112 30,115 Z" fill="#60a5fa" fill-opacity="0.3" />

    <!-- Trees on Right -->
    <path d="M 460,115 C 445,110 445,85 460,80 C 462,70 478,70 482,80 C 495,82 495,108 485,115 Z" fill="#93c5fd" fill-opacity="0.4" />
    <path d="M 470,115 C 460,112 460,98 470,95 C 472,90 485,90 488,95 C 498,98 498,112 490,115 Z" fill="#60a5fa" fill-opacity="0.3" />
  </g>
</svg>
