<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antenna / Head topper -->
  <circle cx="50" cy="12" r="5" fill="url(#blueAccent)" />
  <rect x="48" y="14" width="4" height="8" rx="2" fill="#94a3b8" />

  <!-- Ears / Side knobs -->
  <rect x="10" y="38" width="8" height="16" rx="4" fill="url(#blueAccent)" />
  <rect x="82" y="38" width="8" height="16" rx="4" fill="url(#blueAccent)" />

  <!-- Robot Head -->
  <rect x="15" y="20" width="70" height="52" rx="26" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="1.5" />
  
  <!-- Head highlight reflection -->
  <ellipse cx="50" cy="26" rx="24" ry="4" fill="#ffffff" opacity="0.8" />

  <!-- Dark Screen Face / Visor -->
  <rect x="23" y="28" width="54" height="36" rx="18" fill="url(#visorGrad)" stroke="url(#blueAccent)" stroke-width="1.5" />

  <!-- Glowing Cyan Eyes -->
  <ellipse cx="38" cy="44" rx="6" ry="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="40" cy="42" r="2.5" fill="#ffffff" />

  <ellipse cx="62" cy="44" rx="6" ry="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="64" cy="42" r="2.5" fill="#ffffff" />

  <!-- Cheerful Smile Line -->
  <path d="M 44,53 Q 50,57 56,53" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />

  <!-- Neck -->
  <rect x="42" y="71" width="16" height="6" rx="3" fill="#64748b" />

  <!-- Robot Body / Shoulders -->
  <path d="M 22,96 C 22,82 34,76 50,76 C 66,76 78,82 78,96 Z" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="1.5" />
  <!-- Chest Badge / Light -->
  <circle cx="50" cy="86" r="4.5" fill="url(#blueAccent)" filter="url(#glow)" />
</svg>
